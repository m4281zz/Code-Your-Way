<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Releasing Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f1f1f1;
      color: #1a1a1a;
      font-family: "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body.inverted { filter: invert(1); }

    /* ── STEP WRAPPER ── */
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .step {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .step.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ── CHROME (always visible) ── */
    #clock {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 200;
      font-family: monospace;
      font-size: 11px;
      color: #888;
      line-height: 1.6;
      opacity: 0.7;
      pointer-events: none;
    }
    #clock .clock-time {
      font-size: 18px;
      color: #1a1a1a;
      font-weight: 700;
      display: block;
    }

    #legend {
      position: fixed;
      bottom: 24px; left: 24px;
      z-index: 200;
      font-family: monospace;
      font-size: 10px;
      color: #888;
      line-height: 1.8;
      opacity: 0.6;
      pointer-events: none;
    }
    #legend span { color: #1a1a1a; font-weight: 700; }

    /* Mic level bar along the bottom edge */
    #level-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 2px;
      background: #1a1a1a;
      width: 0%;
      z-index: 300;
      transition: width 0.08s ease;
      pointer-events: none;
    }

    /* ══════════════════════════════════
       STEP 1 — RECORD
    ══════════════════════════════════ */
    #step-record {}

    .step-eyebrow {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 52px;
    }

    #mic-btn {
      width: 112px; height: 112px;
      border-radius: 50%;
      border: 1.5px solid #1a1a1a;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.3s ease;
    }
    #mic-btn:hover { background: rgba(0,0,0,0.04); }
    #mic-btn svg { width: 36px; height: 36px; }

    /* Pulse rings driven by CSS variable --pulse */
    #mic-btn::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(26,26,26,0.25);
      transform: scale(var(--pulse, 1));
      transition: transform 0.08s ease;
      pointer-events: none;
    }
    #mic-btn::after {
      content: '';
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      border: 1px solid rgba(26,26,26,0.12);
      transform: scale(var(--pulse, 1));
      transition: transform 0.12s ease;
      pointer-events: none;
    }

    .mic-label {
      margin-top: 28px;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
    }

    #timer-display {
      margin-top: 20px;
      font-family: monospace;
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.08em;
      min-height: 40px;
    }

    .record-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 48px;
    }
    .record-controls select,
    .record-controls button {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid rgba(26,26,26,0.25);
      color: #1a1a1a;
      padding: 9px 18px;
      cursor: pointer;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .record-controls button:hover  { border-color: #1a1a1a; }
    .record-controls button:disabled { opacity: 0.2; cursor: default; border-color: rgba(26,26,26,0.15); }
    .record-controls select { appearance: none; padding-right: 28px; }

    /* Transcript floating at bottom */
    #transcript-preview {
      position: fixed;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      width: 90%;
      font-size: 15px;
      line-height: 1.75;
      color: #1a1a1a;
      border-left: 3px solid #1a1a1a;
      padding-left: 20px;
      font-family: "Georgia", serif;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #transcript-preview.visible { opacity: 1; }

    /* ══════════════════════════════════
       STEP 2 — DANDELION
    ══════════════════════════════════ */
    #step-dandelion { padding: 0; }

    #canvasContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #canvasContainer canvas { display: block; }

    #done-btn {
      position: fixed;
      bottom: 40px; right: 40px;
      z-index: 200;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: #1a1a1a;
      color: #f1f1f1;
      border: none;
      padding: 13px 26px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, background 0.2s;
    }
    #done-btn.visible { opacity: 1; pointer-events: all; }
    #done-btn:hover   { background: #333; }

    /* ══════════════════════════════════
       STEP 3 — RESULT
    ══════════════════════════════════ */
    #step-result {}

    .result-eyebrow {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 40px;
    }

    #result-canvas-wrap canvas { display: block; }

    .result-label {
      margin-top: 24px;
      font-family: "Georgia", serif;
      font-size: 17px;
      color: #888;
      font-style: italic;
    }

    #reset-btn {
      margin-top: 40px;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      background: transparent;
      color: #1a1a1a;
      border: 1px solid rgba(26,26,26,0.3);
      padding: 10px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s;
    }
    #reset-btn:hover { border-color: #1a1a1a; }
    #reset-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Always-on chrome -->
  <div id="clock">
    <span class="clock-time" id="clockTime"></span>
    <span id="clockDate"></span>
  </div>
  <div id="legend">
    <p><span>J</span> invert</p>
    <p><span>A</span> font</p>
  </div>
  <div id="level-bar"></div>

  <div id="app">

    <!-- ══ STEP 1: RECORD ══ -->
    <section id="step-record" class="step active">
      <p class="step-eyebrow">Let your voice become the wind</p>

      <button id="mic-btn" style="--pulse:1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8"  y1="22" x2="16" y2="22"/>
        </svg>
      </button>

      <p class="mic-label" id="mic-label">Start Recording</p>
      <div id="timer-display"></div>

      <div class="record-controls">
        <select id="langSelect">
          <option value="en-US">English</option>
          <option value="zh-CN">中文</option>
          <option value="ja-JP">日本語</option>
        </select>
        <button id="stop-btn"         disabled>Stop</button>
        <button id="to-dandelion-btn" disabled>See Growth →</button>
      </div>
    </section>

    <!-- ══ STEP 2: DANDELION ══ -->
    <section id="step-dandelion" class="step">
      <div id="canvasContainer"></div>
      <button id="done-btn">Reveal Echo →</button>
    </section>

    <!-- ══ STEP 3: RESULT ══ -->
    <section id="step-result" class="step">
      <p class="result-eyebrow">Your Echo, Visualized</p>
      <div id="result-canvas-wrap"></div>
      <p class="result-label">Generated Dandelion</p>
      <button id="reset-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
        </svg>
        Start Over
      </button>
    </section>

  </div>

  <!-- Floating transcript (shown during recording) -->
  <div id="transcript-preview"></div>

  <script>
  // ═══════════════════════════════════════════════
  // STATE MACHINE  (steps: 1=Record, 2=Dandelion, 3=Result)
  // ═══════════════════════════════════════════════
  let currentStep = 1;
  const stepEls = {
    1: document.getElementById('step-record'),
    2: document.getElementById('step-dandelion'),
    3: document.getElementById('step-result'),
  };

  function goTo(n) {
    stepEls[currentStep].classList.remove('active');
    currentStep = n;
    stepEls[n].classList.add('active');
    onEnter(n);
  }

  function onEnter(n) {
    if (n === 2) initDandelion();
    if (n === 3) initResult();
  }

  // ═══════════════════════════════════════════════
  // CLOCK
  // ═══════════════════════════════════════════════
  function updateClock() {
    const now = new Date();
    document.getElementById('clockTime').textContent =
      now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    document.getElementById('clockDate').textContent =
      now.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ═══════════════════════════════════════════════
  // KEYBOARD SHORTCUTS
  // ═══════════════════════════════════════════════
  const fonts = [
    'Georgia, serif',
    '"Press Start 2P", monospace',
    '"Courier New", monospace',
    '"Arial Black", sans-serif',
    'Impact, sans-serif',
  ];
  let fontIndex = 0;
  let inverted  = false;

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key.toLowerCase() === 'j') {
      inverted = !inverted;
      document.body.classList.toggle('inverted', inverted);
    }
    if (e.key.toLowerCase() === 'a') {
      fontIndex = (fontIndex + 1) % fonts.length;
      document.querySelectorAll('h1').forEach(el => el.style.fontFamily = fonts[fontIndex]);
    }
  });

  // ═══════════════════════════════════════════════
  // MIC VOLUME  (Lovable's useMicrophone, plain JS)
  // ═══════════════════════════════════════════════
  const mic = {
    isActive: false,
    level: 0,
    _stream: null,
    _analyser: null,
    _ctx: null,
    _raf: 0,

    async start() {
      try {
        this._stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        this._ctx    = new AudioContext();
        const src    = this._ctx.createMediaStreamSource(this._stream);
        this._analyser = this._ctx.createAnalyser();
        this._analyser.fftSize = 256;
        src.connect(this._analyser);
        this.isActive = true;
        this._tick();
      } catch(e) { console.warn('Mic denied', e); }
    },

    _tick() {
      const data = new Uint8Array(this._analyser.frequencyBinCount);
      const loop = () => {
        this._analyser.getByteFrequencyData(data);
        this.level = data.reduce((a,b) => a+b, 0) / data.length / 255;
        this._raf  = requestAnimationFrame(loop);
      };
      loop();
    },

    stop() {
      cancelAnimationFrame(this._raf);
      this._stream?.getTracks().forEach(t => t.stop());
      this._ctx?.close();
      this.isActive = false;
      this.level    = 0;
    }
  };

  // ═══════════════════════════════════════════════
  // SPEECH RECOGNITION
  // ═══════════════════════════════════════════════
  window.appState = { transcript: '', isRecording: false };

  let recognition   = null;
  let timerInterval = null;
  let timerStart    = null;

  (function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    recognition = new SR();
    recognition.lang = document.getElementById('langSelect').value;
    recognition.continuous     = true;
    recognition.interimResults = true;

    recognition.onresult = e => {
      let final = '', interim = '';
      for (let i = 0; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        e.results[i].isFinal ? (final += t + ' ') : (interim += t);
      }
      window.appState.transcript = (final + interim).trim();
      syncTranscriptUI();
    };

    recognition.onend = () => {
      if (window.appState.isRecording) {
        try { recognition.start(); } catch {}
      }
    };
  })();

  function syncTranscriptUI() {
    const t   = window.appState.transcript;
    const pre = document.getElementById('transcript-preview');
    if (t && currentStep === 1) {
      pre.textContent = t;
      pre.classList.add('visible');
    } else {
      pre.classList.remove('visible');
    }
    document.getElementById('to-dandelion-btn').disabled = !t;
    if (t && currentStep === 2) {
      document.getElementById('done-btn').classList.add('visible');
    }
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }

  // ═══════════════════════════════════════════════
  // STEP 1 — RECORD  interactions
  // ═══════════════════════════════════════════════
  let micRecording = false;

  const micBtn = document.getElementById('mic-btn');

  micBtn.addEventListener('click', async () => {
    if (!micRecording) {
      // ── START ──
      micRecording = true;
      window.appState.isRecording = true;
      window.appState.transcript  = '';
      syncTranscriptUI();

      micBtn.style.background = 'rgba(26,26,26,0.06)';
      document.getElementById('mic-label').textContent = 'Listening…';
      document.getElementById('stop-btn').disabled     = false;

      timerStart = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        document.getElementById('timer-display').textContent = formatTime(Date.now() - timerStart);
      }, 250);

      await mic.start();

      if (recognition) {
        recognition.lang = document.getElementById('langSelect').value;
        try { recognition.start(); } catch {}
      }

      // Animate pulse ring with mic level
      ;(function animatePulse() {
        if (!micRecording) return;
        const scale = 1 + mic.level * 0.55;
        micBtn.style.setProperty('--pulse', scale);
        document.getElementById('level-bar').style.width = (mic.level * 100) + '%';
        requestAnimationFrame(animatePulse);
      })();

    } else {
      stopRecording();
    }
  });

  document.getElementById('stop-btn').addEventListener('click', stopRecording);

  function stopRecording() {
    micRecording = false;
    window.appState.isRecording = false;
    micBtn.style.background = 'transparent';
    micBtn.style.setProperty('--pulse', 1);
    document.getElementById('mic-label').textContent    = 'Stopped';
    document.getElementById('stop-btn').disabled        = true;
    document.getElementById('level-bar').style.width    = '0%';
    clearInterval(timerInterval);
    mic.stop();
    if (recognition) { try { recognition.stop(); } catch {} }
  }

  document.getElementById('to-dandelion-btn').addEventListener('click', () => {
    stopRecording();
    document.getElementById('transcript-preview').classList.remove('visible');
    goTo(2);
  });

  document.getElementById('langSelect').addEventListener('change', () => {
    if (recognition) recognition.lang = document.getElementById('langSelect').value;
  });

  // ═══════════════════════════════════════════════
  // STEP 2 — DANDELION  p5.js sketch
  // ═══════════════════════════════════════════════
  let p5Live = null;

  function initDandelion() {
    if (window.appState.transcript) {
      document.getElementById('done-btn').classList.add('visible');
    }
    if (p5Live) { p5Live.remove(); p5Live = null; }

    p5Live = new p5(function(p) {
      let cx = 0, cy = 0, dotR = 10;
      let particles = [], lastText = '';

      class Particle {
        constructor(char, x, y, angle, delay) {
          this.char = char;
          this.x = x; this.y = y;
          this.bx = x; this.by = y;
          this.angle = angle;
          this.flyAt = p.millis() + delay;
          this.flying = false;
          this.vx = 0; this.vy = 0;
        }
        update() {
          if (p.millis() > this.flyAt && !this.flying) {
            this.flying = true;
            this.vx = p.random(-0.8, 2.2);
            this.vy = p.random(-3.4, -0.8);
          }
          if (this.flying) { this.x += this.vx; this.y += this.vy; }
        }
        draw() {
          let dx = this.x, dy = this.y;
          if (!this.flying) {
            const t = p.millis() * 0.001;
            dx = this.bx + p.sin(t + this.bx * 0.02) * 2.8;
            dy = this.by + p.cos(t * 0.8 + this.by * 0.02) * 2.8;
          }
          // line
          p.stroke(26, 26, 26, 55); p.strokeWeight(1);
          if (this.flying) {
            const spd = p.sqrt(this.vx*this.vx + this.vy*this.vy);
            if (spd > 0) p.line(dx, dy, dx-(this.vx/spd)*34, dy-(this.vy/spd)*34);
          } else {
            p.line(cx, cy, dx, dy);
          }
          // char
          p.push();
          p.translate(dx, dy);
          p.rotate(p.radians(this.angle + 90));
          p.noStroke(); p.fill(26,26,26); p.textSize(18);
          p.text(this.char, 0, 0);
          p.pop();
        }
        offScreen() {
          return this.x < -120 || this.x > p.width+120 || this.y < -120 || this.y > p.height+120;
        }
      }

      function buildParticles(text) {
        particles = [];
        const chars = [...text];
        p.randomSeed(chars.length);
        let idx = 0;
        for (let layer = 1; layer <= 11 && idx < chars.length; layer++) {
          const r = layer * 24 + dotR + 16;
          let a = -90 + p.random(0, 26);
          while (a < 270 && idx < chars.length) {
            const rad = p.radians(a);
            particles.push(new Particle(chars[idx], cx+p.cos(rad)*r, cy+p.sin(rad)*r, a, p.random(2800,5200)));
            idx++; a += 9;
          }
        }
      }

      p.setup = function() {
        const cont = document.getElementById('canvasContainer');
        const cvs  = p.createCanvas(cont.offsetWidth || innerWidth, cont.offsetHeight || innerHeight);
        cvs.parent('canvasContainer');
        p.textAlign(p.CENTER, p.CENTER);
        cx = p.width/2; cy = p.height * 0.38;
      };

      p.draw = function() {
        p.background(241,241,241);

        // stem
        p.stroke(26,26,26); p.strokeWeight(2.2); p.noFill();
        p.beginShape();
        p.vertex(cx, cy);
        p.bezierVertex(cx+6, cy+100, cx-88, cy+240, cx-28, p.height-18);
        p.endShape();

        // center dot — pulses with live mic level
        const pulse = mic.isActive ? mic.level : 0;
        const r = dotR + pulse * 18;
        p.noStroke(); p.fill(26,26,26);
        p.circle(cx, cy, r * 2);
        if (pulse > 0.05) {
          p.noFill(); p.stroke(26,26,26,35); p.strokeWeight(1);
          p.circle(cx, cy, (r + pulse*28) * 2);
        }

        // particles
        const txt = window.appState.transcript || '';
        if (txt !== lastText) {
          txt.trim() ? buildParticles(txt) : (particles = []);
          lastText = txt;
        }
        particles = particles.filter(p2 => !p2.offScreen());
        particles.forEach(p2 => { p2.update(); p2.draw(); });

        if (!txt.trim()) {
          p.fill(26,26,26,100); p.noStroke(); p.textSize(14);
          p.text('Your words will bloom here…', p.width/2, p.height*0.82);
        }
      };

      p.windowResized = function() {
        const cont = document.getElementById('canvasContainer');
        p.resizeCanvas(cont.offsetWidth || innerWidth, cont.offsetHeight || innerHeight);
        cx = p.width/2; cy = p.height * 0.38;
        if (lastText.trim()) buildParticles(lastText);
      };
    });
  }

  document.getElementById('done-btn').addEventListener('click', () => {
    if (p5Live) p5Live.noLoop();
    goTo(3);
  });

  // ═══════════════════════════════════════════════
  // STEP 3 — RESULT  static mini dandelion
  // ═══════════════════════════════════════════════
  function initResult() {
    const wrap = document.getElementById('result-canvas-wrap');
    wrap.innerHTML = '';
    const size = Math.min(460, window.innerWidth * 0.86);
    wrap.style.width  = size + 'px';
    wrap.style.height = size + 'px';

    new p5(function(p) {
      p.setup = function() {
        const cvs = p.createCanvas(size, size);
        cvs.parent('result-canvas-wrap');
        p.textAlign(p.CENTER, p.CENTER);
        p.noLoop();

        p.background(241,241,241);
        const cx = size/2, cy = size*0.38;
        const rDot = Math.min(size*0.024, 12);

        // stem
        p.stroke(26,26,26); p.strokeWeight(1.6); p.noFill();
        p.beginShape();
        p.vertex(cx, cy);
        p.bezierVertex(cx+4, cy+60, cx-44, cy+130, cx-14, size-10);
        p.endShape();

        // center dot
        p.noStroke(); p.fill(26,26,26);
        p.circle(cx, cy, rDot*2);

        // chars
        const text = window.appState.transcript || '';
        if (!text.trim()) return;
        const chars = [...text];
        p.randomSeed(chars.length);
        let idx = 0;
        for (let layer = 1; layer <= 11 && idx < chars.length; layer++) {
          const r = layer * (size*0.055) + rDot + 6;
          let a = -90 + p.random(0,26);
          while (a < 270 && idx < chars.length) {
            const rad = p.radians(a);
            const px  = cx + p.cos(rad)*r;
            const py  = cy + p.sin(rad)*r;
            p.stroke(26,26,26,45); p.strokeWeight(0.7);
            p.line(cx, cy, px, py);
            p.push();
            p.translate(px, py);
            p.rotate(p.radians(a+90));
            p.noStroke(); p.fill(26,26,26);
            p.textSize(size*0.024);
            p.text(chars[idx], 0, 0);
            p.pop();
            idx++; a += 9;
          }
        }
      };
    });
  }

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (p5Live) { p5Live.remove(); p5Live = null; }
    window.appState.transcript  = '';
    window.appState.isRecording = false;
    document.getElementById('done-btn').classList.remove('visible');
    document.getElementById('result-canvas-wrap').innerHTML = '';
    document.getElementById('timer-display').textContent = '';
    document.getElementById('mic-label').textContent = 'Start Recording';
    document.getElementById('stop-btn').disabled = true;
    document.getElementById('to-dandelion-btn').disabled = true;
    micRecording = false;
    goTo(1);
  });

  </script>
</body>
